<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>

  <!-- Brain icon - simplified bold version for small sizes -->
  <g transform="translate(256, 235)" fill="none" stroke="white" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left hemisphere -->
    <path d="M-10,-95 C-60,-95 -105,-65 -115,-25 C-125,15 -112,50 -95,72 C-78,94 -50,108 -10,112"/>
    <!-- Left folds -->
    <path d="M-10,-50 C-48,-45 -70,-28 -75,-5" opacity="0.65"/>
    <path d="M-10,10 C-50,15 -75,35 -78,55" opacity="0.65"/>

    <!-- Right hemisphere -->
    <path d="M10,-95 C60,-95 105,-65 115,-25 C125,15 112,50 95,72 C78,94 50,108 10,112"/>
    <!-- Right folds -->
    <path d="M10,-50 C48,-45 70,-28 75,-5" opacity="0.65"/>
    <path d="M10,10 C50,15 75,35 78,55" opacity="0.65"/>

    <!-- Center line -->
    <path d="M0,-95 L0,112" opacity="0.4" stroke-width="18"/>

    <!-- Brain stem -->
    <path d="M0,112 L0,138" opacity="0.7"/>
  </g>

  <!-- Moon accent -->
  <circle cx="355" cy="118" r="32" fill="#c4b5fd" opacity="0.85"/>
  <circle cx="367" cy="108" r="26" fill="#8b5cf6"/>

  <!-- Subtle sparkle -->
  <circle cx="157" cy="128" r="6" fill="white" opacity="0.35"/>
  <circle cx="130" cy="180" r="4" fill="white" opacity="0.25"/>
</svg>
