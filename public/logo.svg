<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:0.2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Subtle glow overlay -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#glow)"/>

  <!-- Brain outline - left hemisphere -->
  <g transform="translate(256, 240)" fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left hemisphere outer -->
    <path d="M-8,-100 C-55,-100 -100,-75 -115,-35 C-130,5 -120,40 -105,65 C-90,90 -60,110 -8,115" opacity="0.95"/>
    <!-- Left hemisphere folds -->
    <path d="M-8,-60 C-45,-55 -70,-35 -75,-10" opacity="0.7"/>
    <path d="M-8,-15 C-50,-10 -80,10 -85,40" opacity="0.7"/>
    <path d="M-8,35 C-40,40 -65,55 -70,75" opacity="0.7"/>

    <!-- Right hemisphere outer -->
    <path d="M8,-100 C55,-100 100,-75 115,-35 C130,5 120,40 105,65 C90,90 60,110 8,115" opacity="0.95"/>
    <!-- Right hemisphere folds -->
    <path d="M8,-60 C45,-55 70,-35 75,-10" opacity="0.7"/>
    <path d="M8,-15 C50,-10 80,10 85,40" opacity="0.7"/>
    <path d="M8,35 C40,40 65,55 70,75" opacity="0.7"/>

    <!-- Center line -->
    <path d="M0,-100 L0,115" opacity="0.5"/>

    <!-- Brain stem -->
    <path d="M0,115 L0,140 C0,155 -10,165 -15,170" opacity="0.8"/>
  </g>

  <!-- Moon crescent overlay (top right) -->
  <g transform="translate(350, 120)">
    <circle cx="0" cy="0" r="38" fill="url(#accent)" opacity="0.9"/>
    <circle cx="14" cy="-12" r="30" fill="#7c3aed"/>
  </g>

  <!-- Small stars -->
  <circle cx="130" cy="110" r="4" fill="white" opacity="0.6"/>
  <circle cx="100" cy="170" r="3" fill="white" opacity="0.4"/>
  <circle cx="390" cy="380" r="3.5" fill="white" opacity="0.5"/>
  <circle cx="420" cy="330" r="2.5" fill="white" opacity="0.3"/>
  <circle cx="150" cy="370" r="3" fill="white" opacity="0.35"/>

  <!-- Sparkle dots around brain -->
  <circle cx="170" cy="190" r="5" fill="#34d399" opacity="0.6"/>
  <circle cx="342" cy="200" r="4" fill="#a78bfa" opacity="0.5"/>
  <circle cx="190" cy="340" r="4" fill="#60a5fa" opacity="0.5"/>
</svg>
